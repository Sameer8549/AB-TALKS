<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Radial Ambient Gold Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4B942" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#F4B942" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#F4B942" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBA3"/>
      <stop offset="45%" stop-color="#F4B942"/>
      <stop offset="100%" stop-color="#B87B1D"/>
    </linearGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181A26"/>
      <stop offset="100%" stop-color="#0C0E14"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Deep Dark Background -->
  <rect width="512" height="512" fill="#07080C"/>

  <!-- Glassmorphism App Icon Card -->
  <g filter="url(#shadow)">
    <rect x="72" y="72" width="368" height="368" rx="80" fill="url(#cardBg)" stroke="#2A2D42" stroke-width="4"/>
  </g>

  <!-- Ambient Gold Radial Glow Halo -->
  <circle cx="256" cy="240" r="160" fill="url(#ambientGlow)"/>

  <!-- Interlocking Monogram: A & B -->
  <g transform="translate(0, -10)">
    <!-- Letter 'A' (Chalk White) -->
    <path d="M 130 330 L 220 130 L 260 130 L 305 235 L 255 235 L 240 195 L 195 195 L 165 270 L 130 330 Z M 217 155 L 233 155 L 225 135 Z" fill="#F0EDE6"/>

    <!-- Letter 'B' (Glowing Gold Gradient) -->
    <path d="M 235 130 L 335 130 C 375 130 400 150 400 180 C 400 205 385 220 360 228 C 395 236 415 258 415 290 C 415 330 380 350 330 350 L 235 350 Z M 285 170 L 285 215 L 330 215 C 348 215 358 206 358 192.5 C 358 179 348 170 330 170 Z M 285 255 L 285 310 L 335 310 C 355 310 368 298 368 282.5 C 368 267 355 255 335 255 Z" fill="url(#goldGradient)"/>

    <!-- Interlocking Metallic Chain Loop wrapped around B -->
    <g transform="translate(320, 260)">
      <rect x="0" y="0" width="70" height="42" rx="21" fill="none" stroke="url(#goldGradient)" stroke-width="9"/>
      <circle cx="35" cy="21" r="7" fill="#22C55E"/>
    </g>
  </g>

  <!-- ABTalks Brand Subtitle -->
  <text x="256" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" letter-spacing="2">
    <tspan fill="#F4B942">AB</tspan><tspan fill="#F0EDE6">Talks</tspan>
  </text>
</svg>
